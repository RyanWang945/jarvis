[project]
name = "jarvis"
version = "0.1.0"
description = "Long-running local AI assistant driven by Feishu, LangGraph, and local skills."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cairosvg>=2.7.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "lark-oapi>=1.4.0",
    "langgraph>=1.1.8",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pydantic-settings>=2.7.0",
    "pymysql>=1.1.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
jarvis = "app.main:main"
jarvis-cli = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pyinstaller>=6.21.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"prompt" = "prompt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow test (e.g. real LLM calls, opt-in only)",
]
norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "data",
    "dist",
    "htmlcov",
    "logs",
    "sandbox",
    "sessions",
]

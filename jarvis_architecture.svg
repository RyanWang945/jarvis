<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis Architecture</title>
  <desc id="desc">Architecture diagram generated from the Jarvis repository showing entry points, API and gateway layers, agent runtime, tool runtime, knowledge base, persistence, and external dependencies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#fff8f1"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#14804a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c75b12"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #102033; }
      .subtitle { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .section-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #102033; }
      .box-title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #102033; }
      .label { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #526173; }
      .tiny { font: 500 11px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .code { font: 600 12px Consolas, "Courier New", monospace; fill: #24445f; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #d8e1eb; stroke-width: 1.4; rx: 16; filter: url(#shadow); }
      .entry { fill: #eaf2ff; stroke: #8cb7f4; stroke-width: 1.2; rx: 12; }
      .api { fill: #e9f7ff; stroke: #7db9d8; stroke-width: 1.2; rx: 12; }
      .runtime { fill: #f1edff; stroke: #aa93df; stroke-width: 1.2; rx: 12; }
      .tool { fill: #fff4df; stroke: #e4a64c; stroke-width: 1.2; rx: 12; }
      .data { fill: #edf9f0; stroke: #7bb88c; stroke-width: 1.2; rx: 12; }
      .external { fill: #f8fafc; stroke: #a8b3c3; stroke-width: 1.2; rx: 12; }
      .infra { fill: #f2f4f7; stroke: #b6c0cc; stroke-width: 1.2; rx: 12; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .flow2 { fill: none; stroke: #14804a; stroke-width: 2.6; marker-end: url(#arrow-green); }
      .flow3 { fill: none; stroke: #c75b12; stroke-width: 2.6; marker-end: url(#arrow-orange); }
      .flow4 { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
      .legend-line-blue { stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .legend-line-green { stroke: #14804a; stroke-width: 3; marker-end: url(#arrow-green); }
      .legend-line-orange { stroke: #c75b12; stroke-width: 3; marker-end: url(#arrow-orange); }
      .legend-line-gray { stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1680" height="1180" fill="url(#bg)"/>
  <text x="64" y="62" class="title">Jarvis 项目架构图</text>
  <text x="64" y="90" class="subtitle">基于当前代码结构生成：FastAPI + Feishu WebSocket + ReAct Agent + Tools + Knowledge Base + MySQL/SQLite/OpenSearch</text>

  <rect x="1176" y="42" width="430" height="78" class="panel"/>
  <line x1="1202" y1="68" x2="1254" y2="68" class="legend-line-blue"/>
  <text x="1268" y="72" class="small">主会话请求/响应流</text>
  <line x1="1202" y1="94" x2="1254" y2="94" class="legend-line-green"/>
  <text x="1268" y="98" class="small">知识库数据/检索流</text>
  <line x1="1452" y1="68" x2="1504" y2="68" class="legend-line-orange"/>
  <text x="1518" y="72" class="small">工具/模型调用</text>
  <line x1="1452" y1="94" x2="1504" y2="94" class="legend-line-gray"/>
  <text x="1518" y="98" class="small">启动/后台依赖</text>

  <!-- Entry layer -->
  <rect x="48" y="150" width="282" height="858" class="panel"/>
  <text x="72" y="186" class="section-title">入口与通道</text>

  <rect x="76" y="220" width="226" height="92" class="entry"/>
  <text x="98" y="250" class="box-title">Feishu Channel</text>
  <text x="98" y="274" class="code">app.channels.feishu</text>
  <text x="98" y="294" class="small">WebSocket 事件、卡片回调</text>

  <rect x="76" y="342" width="226" height="88" class="entry"/>
  <text x="98" y="371" class="box-title">HTTP API</text>
  <text x="98" y="395" class="code">app.main / app.api.routes</text>
  <text x="98" y="415" class="small">FastAPI + uvicorn</text>

  <rect x="76" y="460" width="226" height="88" class="entry"/>
  <text x="98" y="489" class="box-title">CLI</text>
  <text x="98" y="513" class="code">app.cli</text>
  <text x="98" y="533" class="small">jarvis-cli chat/run/status</text>

  <rect x="76" y="578" width="226" height="98" class="infra"/>
  <text x="98" y="608" class="box-title">App Lifespan</text>
  <text x="98" y="632" class="code">bootstrap_registries()</text>
  <text x="98" y="652" class="small">skills 启动加载</text>

  <rect x="76" y="706" width="226" height="114" class="infra"/>
  <text x="98" y="736" class="box-title">Scheduler Worker</text>
  <text x="98" y="760" class="code">app.scheduler.runtime</text>
  <text x="98" y="780" class="small">每 30s tick 到期提醒</text>
  <text x="98" y="800" class="small">通过 Feishu 发送</text>

  <rect x="76" y="850" width="226" height="88" class="infra"/>
  <text x="98" y="879" class="box-title">Config / Logging</text>
  <text x="98" y="903" class="code">app.config</text>
  <text x="98" y="923" class="small">JARVIS_* 环境配置</text>

  <!-- API and gateway -->
  <rect x="374" y="150" width="338" height="858" class="panel"/>
  <text x="398" y="186" class="section-title">API / Gateway 层</text>

  <rect x="402" y="220" width="282" height="114" class="api"/>
  <text x="424" y="250" class="box-title">GatewayService</text>
  <text x="424" y="274" class="code">app.gateway.service</text>
  <text x="424" y="294" class="small">InboundEvent -&gt; MessageCreateRequest</text>
  <text x="424" y="314" class="small">决定是否创建 turn</text>

  <rect x="402" y="364" width="282" height="134" class="api"/>
  <text x="424" y="394" class="box-title">Conversation API</text>
  <text x="424" y="418" class="code">app.api.agent</text>
  <text x="424" y="438" class="small">/messages、/conversations</text>
  <text x="424" y="458" class="small">/turns/{id}/run、cancel</text>
  <text x="424" y="478" class="small">调用 store 与 AgentRuntime</text>

  <rect x="402" y="528" width="282" height="144" class="api"/>
  <text x="424" y="558" class="box-title">Knowledge Base API</text>
  <text x="424" y="582" class="code">app.knowledge_base.api</text>
  <text x="424" y="602" class="small">/kb/ingest、index、search</text>
  <text x="424" y="622" class="small">/kb/eval/*</text>
  <text x="424" y="642" class="small">/kb/sec/parse|ingest|index|search</text>

  <rect x="402" y="702" width="282" height="120" class="data"/>
  <text x="424" y="732" class="box-title">Conversation Store</text>
  <text x="424" y="756" class="code">app.persistence.conversation_store</text>
  <text x="424" y="776" class="small">MySQLConversationStore</text>
  <text x="424" y="796" class="small">用户、会话、消息、turn、tool audit</text>

  <rect x="402" y="852" width="282" height="86" class="api"/>
  <text x="424" y="882" class="box-title">Schemas / Models</text>
  <text x="424" y="906" class="code">app.api.schemas</text>
  <text x="424" y="926" class="code">app.persistence.models</text>

  <!-- Agent runtime -->
  <rect x="756" y="150" width="430" height="858" class="panel"/>
  <text x="780" y="186" class="section-title">Agent Runtime 层</text>

  <rect x="786" y="220" width="168" height="96" class="runtime"/>
  <text x="808" y="250" class="box-title">AgentRuntime</text>
  <text x="808" y="274" class="code">runtime.py</text>
  <text x="808" y="294" class="small">run_turn 外层编排</text>

  <rect x="984" y="220" width="170" height="96" class="runtime"/>
  <text x="1006" y="250" class="box-title">TurnRuntime</text>
  <text x="1006" y="274" class="code">runtime.py</text>
  <text x="1006" y="294" class="small">prepare/loop/finalize</text>

  <rect x="786" y="346" width="168" height="112" class="runtime"/>
  <text x="808" y="376" class="box-title">ContextManager</text>
  <text x="808" y="400" class="code">context_manager.py</text>
  <text x="808" y="420" class="small">会话记录裁剪</text>
  <text x="808" y="440" class="small">skills 注入 prompt</text>

  <rect x="984" y="346" width="170" height="112" class="runtime"/>
  <text x="1006" y="376" class="box-title">RuntimePolicy</text>
  <text x="1006" y="400" class="code">runtime_policy.py</text>
  <text x="1006" y="420" class="small">turn 类型/能力</text>
  <text x="1006" y="440" class="small">允许工具与步数</text>

  <rect x="786" y="488" width="368" height="154" class="runtime"/>
  <text x="808" y="518" class="box-title">ReAct Graph</text>
  <text x="808" y="542" class="code">app.agent_react.react_graph</text>
  <text x="808" y="566" class="small">call_llm -&gt; should_continue -&gt; execute_tools</text>
  <text x="808" y="586" class="small">记录 assistant/tool 消息与 tool_calls</text>
  <text x="808" y="606" class="small">收集 artifacts，支持 Codex approval</text>

  <rect x="786" y="672" width="168" height="108" class="runtime"/>
  <text x="808" y="702" class="box-title">ModelRouter</text>
  <text x="808" y="726" class="code">app.llm.model_router</text>
  <text x="808" y="746" class="small">按 node/profile</text>
  <text x="808" y="766" class="small">解析模型客户端</text>

  <rect x="984" y="672" width="170" height="108" class="runtime"/>
  <text x="1006" y="702" class="box-title">ChatClient</text>
  <text x="1006" y="726" class="code">app.llm.client</text>
  <text x="1006" y="746" class="small">/chat/completions</text>
  <text x="1006" y="766" class="small">provider adapters</text>

  <rect x="786" y="810" width="368" height="128" class="runtime"/>
  <text x="808" y="840" class="box-title">Session / Artifacts / Usage</text>
  <text x="808" y="864" class="code">session_state.py / artifacts.py</text>
  <text x="808" y="884" class="small">会话状态写回 conversation.metadata</text>
  <text x="808" y="904" class="small">本地产物转 ChannelAttachment，SVG 可渲染预览</text>

  <!-- Tools -->
  <rect x="1230" y="150" width="390" height="858" class="panel"/>
  <text x="1254" y="186" class="section-title">工具与外部能力</text>

  <rect x="1260" y="220" width="330" height="104" class="tool"/>
  <text x="1282" y="250" class="box-title">Tool Runtime</text>
  <text x="1282" y="274" class="code">app.tools.definitions / runtime</text>
  <text x="1282" y="294" class="small">工具目录、LLM function schema、policy check</text>

  <rect x="1260" y="352" width="154" height="104" class="tool"/>
  <text x="1280" y="382" class="box-title">Repo 工具</text>
  <text x="1280" y="406" class="code">delegate_to_codex</text>
  <text x="1280" y="426" class="small">coder / shell</text>

  <rect x="1436" y="352" width="154" height="104" class="tool"/>
  <text x="1456" y="382" class="box-title">Search 工具</text>
  <text x="1456" y="406" class="code">tavily / x_search</text>
  <text x="1456" y="426" class="small">外部搜索 API</text>

  <rect x="1260" y="486" width="154" height="104" class="tool"/>
  <text x="1280" y="516" class="box-title">Knowledge 工具</text>
  <text x="1280" y="540" class="code">business_knowledge</text>
  <text x="1280" y="560" class="small">OpenSearch 业务知识</text>

  <rect x="1436" y="486" width="154" height="104" class="tool"/>
  <text x="1456" y="516" class="box-title">Wiki 工具</text>
  <text x="1456" y="540" class="code">obsidian_wiki</text>
  <text x="1456" y="560" class="small">query/draft/apply</text>

  <rect x="1260" y="620" width="154" height="104" class="tool"/>
  <text x="1280" y="650" class="box-title">Reminder 工具</text>
  <text x="1280" y="674" class="code">scheduled_task</text>
  <text x="1280" y="694" class="small">SchedulerService</text>

  <rect x="1436" y="620" width="154" height="104" class="tool"/>
  <text x="1456" y="650" class="box-title">User/File 工具</text>
  <text x="1456" y="674" class="code">ask_user/write_file</text>
  <text x="1456" y="694" class="small">低风险交互</text>

  <rect x="1260" y="764" width="330" height="174" class="external"/>
  <text x="1282" y="794" class="box-title">外部服务依赖</text>
  <text x="1282" y="820" class="small">Feishu Open Platform：WS、消息、图片上传</text>
  <text x="1282" y="842" class="small">DeepSeek / Kimi / Gemini：OpenAI-compatible LLM</text>
  <text x="1282" y="864" class="small">Tavily Search、xAI Responses x_search</text>
  <text x="1282" y="886" class="small">Codex app server / local worker</text>
  <text x="1282" y="908" class="small">Obsidian vault、repository registry</text>

  <!-- Knowledge base band -->
  <rect x="48" y="1048" width="1572" height="102" class="panel"/>
  <text x="72" y="1078" class="section-title">知识库子系统（app.knowledge_base）</text>

  <rect x="268" y="1084" width="166" height="54" class="data"/>
  <text x="286" y="1106" class="box-title">Ingest</text>
  <text x="286" y="1127" class="code">ingest/sec_ingest</text>

  <rect x="468" y="1084" width="166" height="54" class="data"/>
  <text x="486" y="1106" class="box-title">Chunking</text>
  <text x="486" y="1127" class="code">chunking/sec_chunking</text>

  <rect x="668" y="1084" width="166" height="54" class="data"/>
  <text x="686" y="1106" class="box-title">Embedding</text>
  <text x="686" y="1127" class="code">DashScope</text>

  <rect x="868" y="1084" width="166" height="54" class="data"/>
  <text x="886" y="1106" class="box-title">Index/Search</text>
  <text x="886" y="1127" class="code">indexing/search</text>

  <rect x="1068" y="1084" width="166" height="54" class="data"/>
  <text x="1086" y="1106" class="box-title">Eval</text>
  <text x="1086" y="1127" class="code">eval/reranking</text>

  <rect x="1268" y="1084" width="166" height="54" class="data"/>
  <text x="1286" y="1106" class="box-title">Repositories</text>
  <text x="1286" y="1127" class="code">SQLite DB</text>

  <!-- Persistence / data stores -->
  <rect x="1218" y="1018" width="402" height="0" fill="none"/>
  <rect x="402" y="962" width="282" height="84" class="external"/>
  <text x="424" y="990" class="box-title">MySQL</text>
  <text x="424" y="1014" class="small">users / conversations / messages / turns / tool_calls</text>
  <text x="424" y="1034" class="small">scheduled_jobs / runs / deliveries / locks</text>

  <rect x="868" y="962" width="282" height="84" class="external"/>
  <text x="890" y="990" class="box-title">SQLite + OpenSearch</text>
  <text x="890" y="1014" class="small">data/knowledge.db：sources/docs/chunks/eval</text>
  <text x="890" y="1034" class="small">OpenSearch：BM25/vector/hybrid/RRF</text>


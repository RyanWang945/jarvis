  <path d="M302 894 C536 894 1000 830 1260 820" class="flow4"/>

  <!-- Local hierarchy callouts -->
  <rect x="72" y="102" width="1028" height="28" fill="none"/>
  <text x="72" y="122" class="tiny">主要包层级：app.main -&gt; app.api / app.gateway / app.channels / app.agent_react / app.tools / app.knowledge_base / app.persistence / app.scheduler / app.llm / app.skills / app.repositories</text>

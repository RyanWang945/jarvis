<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis 架构图</title>
  <desc id="desc">Jarvis 仓库的模块级架构关系图，展示入口、网关、存储、Agent、模型、工具、知识库、技能与调度的主要关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .module-title { font: 700 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #0f172a; }
      .module-text { font: 400 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
      .module-small { font: 400 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .label { font: 500 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>

  <text x="60" y="58" class="title">Jarvis 本地 AI 助手架构</text>
  <text x="60" y="84" class="subtitle">FastAPI + Feishu + ReAct Agent + 工具编排 + 知识库检索</text>

  <!-- 外部入口 -->
  <rect x="60" y="130" width="210" height="135" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="84" y="164" class="module-title">外部入口</text>
  <text x="84" y="193" class="module-text">飞书 WebSocket 事件</text>
  <text x="84" y="218" class="module-text">HTTP/CLI 调用</text>
  <text x="84" y="243" class="module-small">用户消息、命令、审批动作</text>

  <!-- 接入与网关 -->
  <rect x="335" y="120" width="250" height="155" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="360" y="154" class="module-title">接入层与网关</text>
  <text x="360" y="183" class="module-text">app.main / FastAPI 路由</text>
  <text x="360" y="208" class="module-text">FeishuChannel 收发消息</text>
  <text x="360" y="233" class="module-text">GatewayService 标准化事件</text>
  <text x="360" y="258" class="module-small">生成会话、消息、Turn</text>

  <!-- 对话存储 -->
  <rect x="665" y="120" width="245" height="155" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="690" y="154" class="module-title">对话与审计存储</text>
  <text x="690" y="183" class="module-text">MySQLConversationStore</text>
  <text x="690" y="208" class="module-text">conversations / messages</text>
  <text x="690" y="233" class="module-text">turns / tool_calls</text>
  <text x="690" y="258" class="module-small">状态、上下文、工具审计</text>

  <!-- Agent Runtime -->
  <rect x="390" y="360" width="330" height="178" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="420" y="395" class="module-title">Agent ReAct 运行时</text>
  <text x="420" y="425" class="module-text">TurnClassifier：意图与资源识别</text>
  <text x="420" y="450" class="module-text">ContextManager：上下文裁剪</text>
  <text x="420" y="475" class="module-text">RuntimePolicy：工具与步数策略</text>
  <text x="420" y="500" class="module-text">react_graph：模型调用 / 工具循环</text>
  <text x="420" y="525" class="module-small">产出 ChannelMessage 与附件元数据</text>

  <!-- LLM -->
  <rect x="790" y="350" width="260" height="145" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="815" y="384" class="module-title">LLM 模型层</text>
  <text x="815" y="413" class="module-text">ModelRouter / ModelProfiles</text>
  <text x="815" y="438" class="module-text">ChatClient OpenAI 兼容接口</text>
  <text x="815" y="463" class="module-small">DeepSeek / Kimi / Gemini 适配</text>

  <!-- Tools -->
  <rect x="80" y="365" width="260" height="175" class="box" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="105" y="400" class="module-title">工具运行时</text>
  <text x="105" y="430" class="module-text">ToolDefinition / policy</text>
  <text x="105" y="455" class="module-text">shell、search、ask_user</text>
  <text x="105" y="480" class="module-text">Codex coder、写文件</text>
  <text x="105" y="505" class="module-small">执行、限权、返回 ToolArtifact</text>

  <!-- Knowledge Base -->
  <rect x="80" y="615" width="350" height="135" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="105" y="649" class="module-title">业务知识库</text>
  <text x="105" y="678" class="module-text">ingest / chunking / indexing / search</text>
  <text x="105" y="703" class="module-text">SQLite 元数据 + OpenSearch 索引</text>
  <text x="105" y="728" class="module-small">DashScope embedding、reranker、评测</text>

  <!-- Skills and Scheduler -->
  <rect x="515" y="615" width="300" height="135" class="box" fill="#e2e8f0" stroke="#475569"/>
  <text x="540" y="649" class="module-title">技能与定时任务</text>
  <text x="540" y="678" class="module-text">SkillRegistry / loader / bootstrap</text>
  <text x="540" y="703" class="module-text">SchedulerService / Worker</text>
  <text x="540" y="728" class="module-small">加载指南、创建提醒、到期投递</text>

  <!-- External services -->
  <rect x="900" y="615" width="220" height="135" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="925" y="649" class="module-title">外部服务</text>
  <text x="925" y="678" class="module-text">模型 API / 飞书 API</text>
  <text x="925" y="703" class="module-text">OpenSearch / DashScope</text>
  <text x="925" y="728" class="module-small">联网检索、上传、推送</text>

  <!-- Main arrows -->
  <path class="arrow" d="M270 198 H335"/>
  <text x="286" y="186" class="label">消息</text>

  <path class="arrow" d="M585 198 H665"/>
  <text x="606" y="186" class="label">入库</text>

  <path class="arrow" d="M785 275 C785 315 720 318 690 360"/>
  <text x="742" y="321" class="label">运行 Turn</text>

  <path class="arrow" d="M665 360 C650 327 650 302 700 275"/>
  <text x="615" y="318" class="label">读上下文</text>

  <path class="arrow" d="M720 425 H790"/>
  <text x="738" y="413" class="label">模型推理</text>

  <path class="arrow" d="M390 453 H340"/>
  <text x="346" y="441" class="label">工具调用</text>

  <path class="arrow-soft" d="M210 540 V615"/>
  <text x="225" y="583" class="label">知识检索</text>

  <path class="arrow-soft" d="M340 495 C435 555 505 580 610 615"/>
  <text x="425" y="562" class="label">技能/提醒</text>

  <path class="arrow-soft" d="M790 465 C690 560 720 595 690 615"/>
  <text x="715" y="568" class="label">配置路由</text>

  <path class="arrow-soft" d="M960 495 C982 535 998 574 1005 615"/>
  <text x="986" y="565" class="label">API</text>

  <path class="arrow-soft" d="M430 690 H515"/>
  <text x="450" y="678" class="label">检索工具</text>

  <path class="arrow-soft" d="M815 690 H900"/>
  <text x="838" y="678" class="label">投递/索引</text>

  <path class="arrow-soft" d="M910 190 C1035 220 1070 330 1045 615"/>
  <text x="1036" y="322" class="label">外部依赖</text>

  <path class="arrow-soft" d="M515 668 C390 610 330 575 260 540"/>
  <text x="360" y="621" class="label">工具指南</text>
</svg>
